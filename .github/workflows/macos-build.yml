name: WireGuard macOS Compatibility

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-15-intel

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Clone WireGuard Apple
        run: |
          git clone --branch 1.0.15-26 --depth 1 \
            https://git.zx2c4.com/wireguard-apple \
            wireguard-apple

      - name: Xcode project information
        run: |
          cd wireguard-apple

          echo "===== XCODE PROJECT ====="
          xcodebuild \
            -project WireGuard.xcodeproj \
            -list

      - name: Inspect deployment targets
        run: |
          cd wireguard-apple

          echo "===== DEPLOYMENT TARGETS ====="

          grep -R \
            "MACOSX_DEPLOYMENT_TARGET" \
            WireGuard.xcodeproj/project.pbxproj \
            || true

      - name: Inspect native targets
        run: |
          cd wireguard-apple

          echo "===== TARGETS ====="

          grep -n \
            'PBXNativeTarget' \
            WireGuard.xcodeproj/project.pbxproj \
            || true

      - name: Inspect Go bridge
        run: |
          cd wireguard-apple

          echo "===== GO BRIDGE FILES ====="

          find . \
            -iname '*go*bridge*' \
            -o -iname '*wireguard-go*' \
            | sort

      - name: Inspect WireGuardKit
        run: |
          cd wireguard-apple

          echo "===== WIREGUARD KIT ====="

          find . \
            -type f \
            \( -name '*.swift' -o -name '*.go' -o -name '*.h' -o -name '*.m' \) \
            | grep -E 'WireGuardKit|WireGuardGo|PacketTunnel' \
            | head -200