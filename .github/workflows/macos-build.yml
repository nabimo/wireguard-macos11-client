name: WireGuard Inspect Config

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Clone WireGuard Apple
        run: |
          git clone --branch 1.0.15-26 --depth 1 \
            https://git.zx2c4.com/wireguard-apple \
            wireguard-apple

      - name: Inspect xcconfig
        working-directory: wireguard-apple
        run: |
          echo "===== Config.xcconfig ====="
          cat Sources/WireGuardApp/Config/Config.xcconfig

          echo
          echo "===== Config directory ====="
          find Sources/WireGuardApp/Config -maxdepth 2 -type f -print | sort

          echo
          echo "===== Developer.xcconfig references ====="
          grep -R "Developer.xcconfig" . --exclude-dir=.git || true

      - name: Inspect project config references
        working-directory: wireguard-apple
        run: |
          echo "===== XCConfig references ====="
          grep -R "\.xcconfig" WireGuard.xcodeproj/project.pbxproj \
            Sources \
            --exclude-dir=.git || true

      - name: Inspect README developer instructions
        working-directory: wireguard-apple
        run: |
          echo "===== README ====="
          grep -ni -C 5 \
            -E "Developer.xcconfig|developer.xcconfig|xcconfig|Xcode|build" \
            README.md || true