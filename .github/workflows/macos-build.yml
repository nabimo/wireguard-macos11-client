name: WireGuard macOS Build Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Clone WireGuard Apple
        run: |
          git clone --branch 1.0.15-26 --depth 1 \
            https://git.zx2c4.com/wireguard-apple \
            wireguard-apple

      - name: Show environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
          go version

      - name: Build WireGuard macOS
        working-directory: wireguard-apple
        run: |
          xcodebuild \
            -project WireGuard.xcodeproj \
            -scheme WireGuardmacOS \
            -configuration Release \
            -sdk macosx \
            -arch x86_64 \
            MACOSX_DEPLOYMENT_TARGET=10.14 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build Network Extension
        working-directory: wireguard-apple
        run: |
          xcodebuild \
            -project WireGuard.xcodeproj \
            -scheme WireGuardNetworkExtensionmacOS \
            -configuration Release \
            -sdk macosx \
            -arch x86_64 \
            MACOSX_DEPLOYMENT_TARGET=10.14 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build Go Bridge
        working-directory: wireguard-apple
        run: |
          xcodebuild \
            -project WireGuard.xcodeproj \
            -scheme WireGuardGoBridgemacOS \
            -configuration Release \
            -sdk macosx \
            -arch x86_64 \
            MACOSX_DEPLOYMENT_TARGET=10.14 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build