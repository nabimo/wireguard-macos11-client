name: macOS Native Build

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show macOS
        run: |
          sw_vers
          uname -m

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk macosx --show-sdk-version

      - name: Show Swift
        run: |
          swift --version

      - name: Show Go
        run: |
          go version || true